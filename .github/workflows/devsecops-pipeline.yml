name: DevSecOps Golden Path Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ── STAGE 1: SECRET SCANNING ──────────────────────────────────────
  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Audit
        run: |
          docker run --rm -v "${PWD}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose || true

  # ── STAGE 2: STATIC CODE ANALYSIS & TESTS ─────────────────────────
  lint-and-test:
    name: Lint & Unit Testing (Go 1.22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: |
          cd services/order-api
          go test -v ./...

  # ── STAGE 3: STATIC APPLICATION SECURITY TESTING (SAST) ───────────
  sast-semgrep:
    name: SAST Scan (Semgrep OWASP Top 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Audit
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep:latest             semgrep scan --config auto --sarif --output=/src/semgrep.sarif /src/services/order-api || true

      - name: Upload SAST SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
        continue-on-error: true

  # ── STAGE 4: SOFTWARE COMPOSITION ANALYSIS (SCA) ──────────────────
  sca-trivy:
    name: SCA Dependency Scan (Trivy FS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/order-api'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload SCA SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-sca
        continue-on-error: true

  # ── STAGE 5: CONTAINER SECURITY, SBOM & CRYPTOGRAPHIC SIGNING ─────
  container-security:
    name: Hardened Container Build, Scan & Syft SBOM
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-test, sast-semgrep, sca-trivy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Security Audit
        uses: docker/build-push-action@v5
        with:
          context: services/order-api
          load: true
          tags: order-api:local-audit

      - name: Scan Container Image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'order-api:local-audit'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Generate Software Bill of Materials (SBOM via Syft)
        uses: anchore/sbom-action@v0
        with:
          image: order-api:local-audit
          format: spdx-json
          output-file: order-api-sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdx-sbom
          path: order-api-sbom.spdx.json

